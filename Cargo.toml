[package]
name = "saifori"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
authors = []
description = "Saifori: private native GNOME personal finance tracker"
license = "MIT"
publish = false
autobins = false

[dependencies]
anyhow = "1.0"
# gtk4/libadwaita bindings must use matching generations.
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev]
debug = 1

[[bin]]
name = "saifori"
path = "src/main.rs"
